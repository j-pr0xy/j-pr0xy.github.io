<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#eef1f4;--panel:#fff;--ink:#14212b;--mute:#5b6b78;--line:#cfd7de;--accent:#0f5c7a;--accent-ink:#fff;--err:#b3261e;--ok:#1b6e3c;--chip:#e8f0f4}
  @media (prefers-color-scheme:dark){:root{--bg:#0e161c;--panel:#16212a;--ink:#e6edf2;--mute:#8fa1ae;--line:#2a3945;--accent:#5fb8d9;--accent-ink:#06222e;--err:#ff8a80;--ok:#7bd69b;--chip:#1c2b36}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
  .wrap{max-width:820px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0}
  .sub{color:var(--mute);margin:0}
  main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
  label{font-size:14px;color:var(--mute)}
  select,button,input{font:inherit}
  select{flex:1;min-width:200px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
  button{padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  button.primary{background:var(--accent);color:var(--accent-ink);border:0}
  button:disabled{opacity:.55;cursor:wait}
  button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
  .chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink);border:1px solid var(--line)}
  .chip strong{font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--mute);font-weight:600}
  td code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .muted{color:var(--mute)}
  #msg{min-height:1.5em;margin:12px 0 0;font-size:14px}
  #msg.err{color:var(--err)} #msg.ok{color:var(--ok)}
  .panel-title{font:600 18px/1.3 Georgia,"Times New Roman",serif;margin:0 0 12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}}
  .card{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg)}
  .card h3{margin:0 0 6px;font-size:15px}
  .card p{margin:0;font-size:13px;color:var(--mute)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Proxy Dashboard</h1>
      <p class="sub" id="userLine">Loading session…</p>
    </div>
    <div class="row" style="margin:0">
      <button type="button" id="refreshBtn">Refresh list</button>
      <button type="button" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main>
    <section id="gate" hidden>
      <p>You need to be signed in. <a href="auth.html">Go to sign-in</a>.</p>
    </section>

    <section id="app" hidden>
      <p class="panel-title">Select a batch for rotation</p>
      <div class="row">
        <label for="batchSelect">Batch</label>
        <select id="batchSelect"></select>
        <button class="primary" type="button" id="loadBatchBtn">Load batch</button>
      </div>

      <div class="chips" id="stats"></div>

      <div class="grid2" style="margin-bottom:18px">
        <div class="card">
          <h3>Next proxy</h3>
          <p id="nextProxy" class="muted">Select a batch and click “Get next”.</p>
          <div class="row" style="margin-top:10px;margin-bottom:0">
            <button class="primary" type="button" id="nextBtn" disabled>Get next</button>
            <button type="button" id="copyBtn" disabled>Copy</button>
          </div>
        </div>
        <div class="card">
          <h3>Rotation state</h3>
          <p id="rotState" class="muted">No batch selected.</p>
        </div>
      </div>

      <p class="panel-title">Proxies in selected batch</p>
      <div style="overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:8px">
        <table>
          <thead>
            <tr><th>#</th><th>Protocol</th><th>Address</th></tr>
          </thead>
          <tbody id="proxyTable">
            <tr><td colspan="3" class="muted">Nothing loaded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <p id="msg" role="status" aria-live="polite"></p>
  </main>
</div>

<script>
  // ---- CONFIG (same as auth page) ----
  const WORKER_URL = 'https://bold-water-a77d.j-proxy-services.workers.dev';
  const SUPABASE_URL = 'https://xvckksduwyydrpxruwph.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_stsvxiKIvR02q5RqXHJiMQ_BwUNU1f2';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);

  let accessToken = null;
  let batches = [];
  let currentBatch = null;
  let rotIndex = 0;
  let lastProxy = null;

  function say(text, type) {
    const m = $('msg');
    m.textContent = text || '';
    m.className = type || '';
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${accessToken}`,
    };
  }

  async function api(path, opts = {}) {
    const res = await fetch(`${WORKER_URL}${path}`, {
      ...opts,
      headers: { ...authHeaders(), ...(opts.headers || {}) },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText || 'Request failed');
    return data;
  }

  async function loadBatches() {
    say('Loading batches…');
    const data = await api('/proxies/batches');
    batches = data.batches || [];
    const sel = $('batchSelect');
    sel.innerHTML = '';
    if (!batches.length) {
      sel.innerHTML = '<option value="">No proxies available</option>';
      say('No proxies returned. Try Refresh list.', 'err');
      return;
    }
    // Prefer showing the smaller numbered batches first, then “all”
    const ordered = [...batches].sort((a, b) => {
      if (a.id === 'all') return 1;
      if (b.id === 'all') return -1;
      if (a.id.endsWith('-all') && !b.id.endsWith('-all')) return 1;
      if (b.id.endsWith('-all') && !a.id.endsWith('-all')) return -1;
      return a.label.localeCompare(b.label);
    });
    for (const b of ordered) {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.label;
      sel.appendChild(opt);
    }
    // restore last choice
    const saved = localStorage.getItem('selectedBatchId');
    if (saved && ordered.some((b) => b.id === saved)) sel.value = saved;

    const protocolCounts = {};
    for (const b of batches) {
      if (b.id.endsWith('-all') || b.id === 'all') {
        protocolCounts[b.protocol || 'mixed'] = b.count;
      }
    }
    $('stats').innerHTML = Object.entries(protocolCounts)
      .map(([p, c]) => `<span class="chip"><strong>${p}</strong> ${c}</span>`)
      .join('');
    say(`Ready · ${data.total} proxies · updated ${new Date(data.fetchedAt).toLocaleTimeString()}`, 'ok');
  }

  async function loadSelectedBatch() {
    const id = $('batchSelect').value;
    if (!id) return;
    say('Loading batch…');
    const data = await api(`/proxies/batch?id=${encodeURIComponent(id)}`);
    currentBatch = data.batch;
    rotIndex = 0;
    lastProxy = null;
    localStorage.setItem('selectedBatchId', id);
    renderTable();
    $('nextBtn').disabled = !currentBatch?.proxies?.length;
    $('copyBtn').disabled = true;
    $('nextProxy').textContent = 'Click “Get next” to start rotating.';
    $('nextProxy').className = 'muted';
    $('rotState').textContent = `Batch “${currentBatch.label}” · ${currentBatch.count} proxies · index 0`;
    say(`Loaded ${currentBatch.count} proxies.`, 'ok');
  }

  function renderTable() {
    const tbody = $('proxyTable');
    tbody.innerHTML = '';
    if (!currentBatch?.proxies?.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="muted">Empty batch.</td></tr>';
      return;
    }
    currentBatch.proxies.forEach((p, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i + 1}</td><td>${p.protocol}</td><td><code>${p.raw}</code></td>`;
      tbody.appendChild(tr);
    });
  }

  async function getNext() {
    if (!currentBatch) return;
    say('Fetching next…');
    try {
      const data = await api(`/proxies/next?batch=${encodeURIComponent(currentBatch.id)}&index=${rotIndex}`);
      lastProxy = data.proxy;
      rotIndex = data.nextIndex;
      $('nextProxy').textContent = data.proxy.raw;
      $('nextProxy').className = '';
      $('rotState').textContent = `Batch “${currentBatch.label}” · index ${data.index + 1}/${data.totalInBatch} · next will be #${data.nextIndex + 1}`;
      $('copyBtn').disabled = false;
      say('Ready.', 'ok');
    } catch (e) {
      say(e.message, 'err');
    }
  }

  function copyProxy() {
    if (!lastProxy) return;
    navigator.clipboard.writeText(lastProxy.raw).then(
      () => say('Copied to clipboard.', 'ok'),
      () => say('Could not copy.', 'err')
    );
  }

  async function refreshList() {
    $('refreshBtn').disabled = true;
    try {
      say('Refreshing from ProxyScrape…');
      await api('/proxies/refresh', { method: 'POST' });
      await loadBatches();
      if (currentBatch) await loadSelectedBatch();
    } catch (e) {
      say(e.message, 'err');
    } finally {
      $('refreshBtn').disabled = false;
    }
  }

  async function init() {
    const { data } = await sb.auth.getSession();
    if (!data.session) {
      $('gate').hidden = false;
      $('userLine').textContent = 'Not signed in';
      return;
    }
    accessToken = data.session.access_token;
    const email = data.session.user?.email || 'signed in';
    $('userLine').textContent = email;
    $('app').hidden = false;

    $('batchSelect').onchange = () => { /* selection only */ };
    $('loadBatchBtn').onclick = () => loadSelectedBatch().catch((e) => say(e.message, 'err'));
    $('nextBtn').onclick = () => getNext();
    $('copyBtn').onclick = copyProxy;
    $('refreshBtn').onclick = refreshList;
    $('logoutBtn').onclick = async () => {
      await sb.auth.signOut();
      location.href = 'auth.html';
    };

    try {
      await loadBatches();
    } catch (e) {
      say(e.message, 'err');
    }
  }

  init();
</script>
</body>
</html>
